<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MPV remote</title>
  <link rel="manifest" href="/manifest.json">

  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <div class="container">
    <a class="nav" href="/files">Files &rarr;</a>

    <form id="videoUrlForm">
      <input
        type="text"
        id="input"
        placeholder="Enter video url"
      >
    </form>

    <div class="row">
      <button data-action="play-pause">Play / Pause</button>
    </div>

    <div class="row">
      <button data-action="vol-down">Vol -</button>
      <button data-action="vol-up">Vol +</button>
    </div>

    <div class="row">
      <button data-action="seek-backward">Seek -</button>
      <button data-action="seek-forward">Seek +</button>
    </div>

    <div class="row">
      <button data-action="change-speed">Change speed</button>
    </div>

    <div class="row">
      <button data-action="show-progress">Progress</button>
    </div>

  </div>

  <script>
    async function loadUrl(url) {
      const response = await fetch("/loadurl", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ url })
      });

      const data = await response.json();
      console.log(data);
    }

    document.getElementById("videoUrlForm").addEventListener("submit", (event) => {
      event.preventDefault();
      loadUrl(document.getElementById("input").value);
    });

    document.querySelectorAll("button[data-action]").forEach((button) => {
      button.addEventListener("click", () => {
        fetch(`/${button.dataset.action}`, { method: "POST" });
      });
    });

    const params = new URLSearchParams(window.location.search);
    const shared = params.get("url") || params.get("text");
    if (shared) {
      const url = shared.match(/https?:\/\/\S+/)?.[0] ?? shared;
      document.getElementById("input").value = url;
      loadUrl(url);
      history.replaceState(null, "", window.location.pathname);
    }

  </script>
</body>
</html>
