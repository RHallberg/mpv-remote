<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Audio Control</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 24px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    .row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 5px;
      background: #333;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #555;
    }

    @media (max-width: 600px) {
      body {
        padding: 0;
      }

      .container {
        max-width: none;
        min-height: 100vh;
        border-radius: 0;
        box-shadow: none;
        padding: 24px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <form id="videoUrlForm">
      <input
        type="text"
        id="input"
        placeholder="Enter video url"
      >
    </form>

    <div class="row">
      <button id="playPause">Play / Pause</button>
    </div>

    <div class="row">
      <button id="volDown">Vol -</button>
      <button id="volUp">Vol +</button>
    </div>

  </div>

  <script>
    document.getElementById("videoUrlForm").addEventListener("submit", (event) => {
      event.preventDefault();
      console.log("Submitted:", document.getElementById("input").value);
    });

    document.getElementById("playPause").addEventListener("click", () => {
      console.log("Play/Pause");
    });

    document.getElementById("volUp").addEventListener("click", () => {
      console.log("Volume up");
    });

    document.getElementById("volDown").addEventListener("click", () => {
      console.log("Volume down");
    });
  </script>
</body>
</html>
